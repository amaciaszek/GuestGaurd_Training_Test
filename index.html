<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GuestGuard Training</title>

  <!-- 1) Set a safe <base> at runtime so GitHub Pages subfolder paths work -->
  <script>
  (() => {
    const isGh = location.hostname.endsWith('github.io');
    const seg = location.pathname.split('/').filter(Boolean)[0] || '';
    const ghBase = isGh && seg ? `/${seg}/` : './';
    let base = document.querySelector('base');
    if (!base) {
      base = document.createElement('base');
      document.head.prepend(base);
    }
    base.href = ghBase;
  })();
  </script>

  <style>
    :root{
      --ui-bg: #0c0f12;
      --ui-fg: #f2f5f7;
      --accent: #27c5a5;
      --pill: #1f2937;
      --pill-fg:#e5e7eb;
      --danger:#ef4444;
      --ok:#22c55e;
      --hint:#94a3b8;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--ui-bg);
      color:var(--ui-fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
    }

    .app {
      display:flex;
      height:100%;
      gap:16px;
      padding:16px;
      box-sizing:border-box;
    }

    .stage-wrap{
      position:relative;
      flex: 1 1 auto;
      background:#0a0d10;
      border:1px solid #1b2330;
      border-radius:16px;
      overflow:hidden;
      box-shadow: var(--shadow);
      min-height: 400px;
    }

    /* Background image scales to fit while preserving aspect ratio */
    #bg {
      width:100%;
      height:100%;
      object-fit: contain;
      display:block;
      background:#0a0d10;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    /* Hotspot layer matches #bg box content rect */
    .hotspot-layer{
      position:absolute;
      inset:0;
      pointer-events:none; /* Each hotspot re-enables pointer events */
    }

    .hotspot{
      position:absolute;
      pointer-events:auto;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      border-radius:999px;
      background: rgba(39,197,165,0.16);
      border:2px solid var(--accent);
      color: var(--ui-fg);
      backdrop-filter: blur(2px);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,.25);
      cursor:pointer;
    }
    .hotspot:hover{ transform: translateY(-1px) scale(1.015); }
    .hotspot.active{
      background: rgba(39,197,165,0.32);
      box-shadow: 0 8px 20px rgba(39,197,165,.35);
    }
    .hotspot.pill{
      border-radius: 18px;
      padding: 10px 14px;
      height: 40px;
      background: var(--pill);
      border:1px solid #2b3647;
      color: var(--pill-fg);
      font-weight:600;
      white-space: nowrap;
    }

    .sidebar{
      width:360px;
      max-width: 40vw;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .card{
      background:#0e141b;
      border:1px solid #1b2330;
      border-radius:14px;
      box-shadow: var(--shadow);
      padding:14px;
    }
    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
    .row > * { flex: 1 1 auto; }
    .title{
      font-size:18px;
      font-weight:700;
      margin:0 0 8px 0;
    }
    .muted{ color: var(--hint); font-size: 12px;}
    .btn{
      appearance:none; border:0; border-radius:10px;
      background:#16202b; color:#e5e7eb; padding:10px 12px; font-weight:600; cursor:pointer;
    }
    .btn:hover{ background:#1d2a38; }
    .btn.primary{ background: var(--accent); color:#07211a; }
    .btn.primary:hover{ filter: brightness(0.95); }
    .input, select{
      width:100%; background:#0b1117; color:#e5e7eb; border:1px solid #1b2330; border-radius:10px; padding:10px 12px;
    }
    .small{ font-size:12px; }

    .audio-bar{
      display:flex; gap:8px; align-items:center;
    }
    .time{
      font-variant-numeric: tabular-nums;
      font-size:12px; color: var(--hint);
      width: 64px; text-align:center;
    }
    .range{
      flex:1 1 auto;
    }
    input[type="range"]{ width:100% }

    /* Modal for hotspot media */
    .modal{
      position:fixed; inset:0; background: rgba(0,0,0,.6);
      display:none; align-items:center; justify-content:center; z-index:1000;
      padding:24px;
    }
    .modal.open{ display:flex; }
    .modal-dialog{
      width:min(1200px, 92vw); max-height: 88vh; overflow:auto; background:#0e141b; border:1px solid #1b2330; border-radius:14px; box-shadow: var(--shadow);
      padding:14px;
    }
    .modal-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px;}
    .modal-body{ display:block; position:relative; }
    .modal video, .modal img{ width:100%; height:auto; display:block; border-radius:10px; }

    .toast{
      position:fixed; right:16px; bottom:16px; background:#111827; color:#e5e7eb; border:1px solid #1f2937;
      padding:10px 12px; border-radius:10px; box-shadow: var(--shadow); font-size:13px;
      max-width: 420px;
    }

    /* === Persistent caption overlay (always available) === */
    .caption-overlay{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:20px;
      max-width:min(90%, 1100px);
      background: rgba(0,0,0,0.65);
      border:1px solid rgba(255,255,255,0.18);
      border-radius:12px;
      padding:12px 14px;
      z-index: 900; /* under modal, above stage */
      font-size: clamp(14px, 1.6vw, 20px);
      line-height:1.55;
      color:#e9eef5;
      text-align:center;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
      display:none;
      backdrop-filter: blur(4px);
    }
    .caption-overlay b{
      font-weight:700;
    }
  </style>
</head>
<body>

  <div class="app">

    <div class="stage-wrap" id="stage">
      <img id="bg" alt="Background" />
      <div class="hotspot-layer" id="hotspots"></div>

      <!-- Persistent captions live here -->
      <div id="cc" class="caption-overlay" aria-live="polite" aria-atomic="true"></div>
    </div>

    <aside class="sidebar">
      <div class="card">
        <h2 class="title" id="chapter-title">Loading…</h2>
        <div class="muted small" id="chapter-id"></div>
        <div class="row" style="margin-top:8px">
          <input class="input" id="chapter-input" placeholder="Chapter JSON (e.g., 2-1.json)" />
          <button class="btn" id="chapter-load">Load</button>
        </div>
        <div class="muted small" style="margin-top:6px">
          Tip: you can also use <code>?chapter=2-1</code> in the URL.
        </div>
      </div>

      <div class="card">
        <div class="row" style="align-items:center; justify-content:space-between">
          <div class="title" style="margin:0">Audio</div>
          <button class="btn" id="btn-reload">Reload</button>
        </div>

        <audio id="audio" preload="auto"></audio>

        <div class="audio-bar" style="margin-top:8px">
          <button class="btn" id="btn-playpause" style="min-width:90px">Play</button>
          <div class="time" id="cur">00:00</div>
          <input class="range" id="seek" type="range" min="0" max="1" step="0.001" value="0">
          <div class="time" id="dur">00:00</div>
        </div>

        <div class="row" style="margin-top:8px">
          <label class="small muted"><input type="checkbox" id="loopHS"> Loop active hotspot</label>
        </div>
        <div class="muted small" id="audio-status" style="margin-top:6px"></div>
      </div>

      <div class="card">
        <div class="title" style="margin:0 0 8px 0">Hotspots</div>
        <div id="hotspot-list" class="small"></div>
      </div>
    </aside>

  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-dialog">
      <div class="modal-head">
        <div id="modal-title" class="title" style="margin:0; font-size:16px;"></div>
        <button class="btn" id="modal-close">Close</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" style="display:none"></div>

  <script>
  /***************
   * URL helpers *
   ***************/
  function showToast(msg, ms=3200){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> t.style.display = 'none', ms);
  }

  // Turn "Assets/..." or "/Assets/..." into a valid URL under our <base>.
  function resolveAsset(p){
    if(!p) return '';
    if(/^([a-z]+:)?\/\//i.test(p)) return p; // absolute
    p = p.replace(/^\/+/, '');
    return new URL(p, document.baseURI).href;
  }

  function withBust(url){ const u = new URL(url, document.baseURI); u.searchParams.set('v', Date.now().toString()); return u.href; }

  /*********************
   * Timecode handling *
   *********************/
  // Parse "HH;MM;SS;FF" -> seconds. Default 30 fps unless overridden in JSON.
  function tcToSeconds(tc, fps=30){
    if(!tc) return 0;
    const m = String(tc).trim().match(/^(\d{2});(\d{2});(\d{2});(\d{2})$/);
    if(!m) return 0;
    const hh = +m[1], mm=+m[2], ss=+m[3], ff=+m[4];
    return hh*3600 + mm*60 + ss + (ff / fps);
  }
  function fmtTime(secs){
    secs = Math.max(0, secs|0);
    const m = (secs/60)|0, s = secs%60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  /****************
   * App state    *
   ****************/
  const state = {
    chapter: null,
    chapterPath: null,
    fps: 30,
    naturalW: 6000,
    naturalH: 4000,
    hotspots: [],
    activeIdx: -1,
    loopActive: false,

    // Captions
    captions: [],  // {start,end,text}
    segStart: 0,
    segEnd: 0,
  };

  const els = {
    bg: document.getElementById('bg'),
    hsLayer: document.getElementById('hotspots'),
    hsList: document.getElementById('hotspot-list'),
    audio: document.getElementById('audio'),
    cur: document.getElementById('cur'),
    dur: document.getElementById('dur'),
    seek: document.getElementById('seek'),
    playpause: document.getElementById('btn-playpause'),
    reload: document.getElementById('btn-reload'),
    status: document.getElementById('audio-status'),
    title: document.getElementById('chapter-title'),
    chapterId: document.getElementById('chapter-id'),
    chapterInput: document.getElementById('chapter-input'),
    chapterLoad: document.getElementById('chapter-load'),
    loopHS: document.getElementById('loopHS'),
    stage: document.getElementById('stage'),
    modal: document.getElementById('modal'),
    modalTitle: document.getElementById('modal-title'),
    modalBody: document.getElementById('modal-body'),
    modalClose: document.getElementById('modal-close'),
    cc: document.getElementById('cc'),
  };

  /********************
   * Layout scaling   *
   ********************/
  function measureContentBox(imgEl){
    const cont = els.stage.getBoundingClientRect();
    const contW = cont.width, contH = cont.height;
    const imgRatio = state.naturalW / state.naturalH;
    const contRatio = contW / contH;

    let drawW, drawH, left, top;
    if (imgRatio > contRatio) {
      drawW = contW; drawH = contW / imgRatio;
      left = 0; top = (contH - drawH)/2;
    } else {
      drawH = contH; drawW = contH * imgRatio;
      top = 0; left = (contW - drawW)/2;
    }
    return {left, top, width: drawW, height: drawH};
  }

  function placeHotspots(){
    const box = measureContentBox(els.bg);
    const scaleX = box.width / state.naturalW;
    const scaleY = box.height / state.naturalH;

    for(const h of state.hotspots){
      const el = h._el;
      if(!el) continue;

      if(h.type === 'circle'){
        const x = box.left + (h.centerX - h.width/2) * scaleX;
        const y = box.top  + (h.centerY - h.height/2) * scaleY;
        const w = h.width * scaleX;
        const hh = h.height * scaleY;
        el.style.left = `${x}px`;
        el.style.top  = `${y}px`;
        el.style.width = `${w}px`;
        el.style.height = `${hh}px`;
      } else if (h.type === 'pill'){
        const y = box.top + 16 + (h.order === 'done' ? 56 : 0);
        const x = h.dock === 'right'
          ? box.left + box.width - 16
          : box.left + 16;
        el.style.top = `${y}px`;
        el.style[h.dock === 'right' ? 'right' : 'left'] = `${els.stage.getBoundingClientRect().width - (x + (h.dock === 'right' ? 0 : 0))}px`;
        el.style.minWidth = '120px';
        el.style.height = '40px';
        el.style.padding = '10px 14px';
      }
    }
  }
  window.addEventListener('resize', placeHotspots);

  /*******************
   * Rendering HS    *
   *******************/
  function clearHotspots(){
    els.hsLayer.innerHTML = '';
    els.hsList.innerHTML = '';
    state.hotspots.length = 0;
    state.activeIdx = -1;
  }

  function addHotspot(hs, idx){
    const el = document.createElement('div');
    el.className = 'hotspot ' + (hs.type === 'pill' ? 'pill' : 'circle');
    el.textContent = hs.label || hs.text || hs.id || `#${idx+1}`;
    el.title = `${hs.text || hs.label || ''}`.trim();
    el.dataset.idx = String(idx);

    if(hs.type === 'circle'){ el.style.borderRadius = '999px'; }

    el.addEventListener('click', () => { openHotspotContent(hs); });
    els.hsLayer.appendChild(el);

    // List entry
    const li = document.createElement('div');
    const start = tcToSeconds(hs.tcStart, state.fps);
    const end   = tcToSeconds(hs.tcEnd, state.fps);
    li.innerHTML = `
      <div style="display:flex; justify-content:space-between; gap:8px; align-items:center; margin:6px 0;">
        <div style="flex:1 1 auto">
          <div style="font-weight:600">${hs.text || hs.label || hs.id || `#${idx+1}`}</div>
          <div class="muted small">${fmtTime(start)} – ${fmtTime(end)}</div>
        </div>
        <button class="btn small" data-jump="${start}">Jump</button>
      </div>
    `;
    li.querySelector('button').addEventListener('click', (e)=>{
      e.stopPropagation();
      if (!isNaN(start)) {
        els.audio.currentTime = start + 0.01;
        els.audio.play().catch(()=>{});
      }
    });
    els.hsList.appendChild(li);

    // keep references
    hs._el = el;
    hs._listEl = li;
  }

  function setActiveHotspot(idx){
    if(state.activeIdx === idx) return;
    state.activeIdx = idx;
    state.hotspots.forEach((h, i)=>{
      if(h._el) h._el.classList.toggle('active', i === idx);
    });

    // Update active segment window for captions
    if (idx >= 0) {
      const h = state.hotspots[idx];
      state.segStart = tcToSeconds(h.tcStart, state.fps);
      state.segEnd   = tcToSeconds(h.tcEnd, state.fps);
    } else {
      state.segStart = 0;
      state.segEnd = 0;
      hideCaption();
    }
  }

  /********************
   * Hotspot content  *
   ********************/
  function openHotspotContent(hs){
    els.modalTitle.textContent = hs.text || hs.label || hs.id || 'Content';
    els.modalBody.innerHTML = '';

    if (hs.contentMedia && hs.contentMedia.type) {
      if (hs.contentMedia.type === 'video') {
        const v = document.createElement('video');
        v.controls = true;
        v.playsInline = true;
        v.src = resolveAsset(hs.contentMedia.src);
        els.modalBody.appendChild(v);
      } else if (hs.contentMedia.type === 'image') {
        const img = document.createElement('img');
        img.alt = hs.text || 'image';
        img.src = resolveAsset(hs.contentMedia.src);
        els.modalBody.appendChild(img);
      }
    }

    if (Array.isArray(hs.realLifeExamples) && hs.realLifeExamples.length){
      for(const ex of hs.realLifeExamples){
        const img = document.createElement('img');
        img.alt = 'example';
        img.src = resolveAsset(ex);
        img.style.marginTop = '10px';
        els.modalBody.appendChild(img);
      }
    }

    els.modal.classList.add('open');
  }
  els.modal.addEventListener('click', (e)=> {
    if (e.target === els.modal) els.modal.classList.remove('open');
  });
  els.modalClose.addEventListener('click', ()=> els.modal.classList.remove('open'));

  /*****************
   * Captions      *
   *****************/
  function hideCaption(){
    els.cc.style.display = 'none';
    els.cc.textContent = '';
  }
  function showCaption(html){
    els.cc.innerHTML = html;
    els.cc.style.display = 'block';
  }
  function findCaptionsForTime(time){
  if (!this.seg || !this.seg.active) return [];

  // Include any caption that overlaps the current segment window
  const overlapsSegment = (cap) =>
    cap.start < this.seg.end && cap.end > this.seg.start;

  // Keep all captions that have STARTED by "time" and overlap the segment.
  // (No slice(...) limiting to 2 — that’s what made them non-persistent.)
  return this.captions
    .filter(overlapsSegment)
    .filter(cap => time >= cap.start);
}

  function updateCaption(time){
    if (!state.captions.length || !state.segEnd) { hideCaption(); return; }
    const caps = findCaptionsForTime(time);
    if (!caps.length) { hideCaption(); return; }
    const html = caps.map(c => c.text).join('<br><br>');
    showCaption(html);
  }
  async function loadTranscriptIfAny(json){
    state.captions = [];
    const path = json && json.transcriptFile;
    if (!path) return;
    try{
      const res = await fetch(resolveAsset(path));
      if (!res.ok) throw new Error(`Transcript load error ${res.status}`);
      const text = await res.text();
      state.captions = parseTranscript(text, state.fps);
      // If audio is already playing, give captions a nudge to render
      updateCaption(els.audio.currentTime || 0);
    }catch(err){
      console.warn('Transcript failed:', err.message);
    }
  }
  function parseTranscript(text, FPS){
    const out = [];
    const lines = String(text||'').split('\n');
    let i=0;
    while(i<lines.length){
      const line = lines[i].trim();
      const tc = /^\d{2};\d{2};\d{2};\d{2}\s*-\s*\d{2};\d{2};\d{2};\d{2}$/;
      if (tc.test(line)){
        const [a,b] = line.split('-').map(s=>s.trim());
        const start = tcToSeconds(a, FPS);
        const end   = tcToSeconds(b, FPS);
        i++;
        let buf = '';
        while(i<lines.length && !tc.test(lines[i])){
          const t = lines[i].trim();
          if (t) buf += (buf ? ' ' : '') + t;
          i++;
        }
        if (buf) out.push({start,end,text:buf});
      } else {
        i++;
      }
    }
    return out;
  }

  /*****************
   * Audio wiring  *
   *****************/
  function bindAudio(){
    const a = els.audio;
    a.onloadedmetadata = () => {
      els.dur.textContent = fmtTime(a.duration|0);
    };
    a.ontimeupdate = () => {
      els.cur.textContent = fmtTime(a.currentTime|0);
      if(a.duration) els.seek.value = (a.currentTime / a.duration).toFixed(3);

      // Active hotspot highlighting + segment window
      let active = -1;
      for (let i=0;i<state.hotspots.length;i++){
        const h = state.hotspots[i];
        const st = tcToSeconds(h.tcStart, state.fps);
        const en = tcToSeconds(h.tcEnd, state.fps);
        if (!isNaN(st) && !isNaN(en) && a.currentTime >= st && a.currentTime < en){
          active = i; break;
        }
      }
      setActiveHotspot(active);

      // Loop active segment if enabled
      if (state.loopActive && active >= 0){
        const h = state.hotspots[active];
        const en = tcToSeconds(h.tcEnd, state.fps);
        if (a.currentTime >= en) {
          const st = tcToSeconds(h.tcStart, state.fps);
          a.currentTime = st + 0.01;
          a.play().catch(()=>{});
        }
      }

      // Persistent captions
      updateCaption(a.currentTime || 0);
    };
    a.onplay = ()=> { els.playpause.textContent = 'Pause'; };
    a.onpause = ()=> { els.playpause.textContent = 'Play'; };

    a.onerror = (ev) => {
      const err = a.error;
      const msg = err ? `Media error (code ${err.code})` : 'audio failed to load';
      els.status.textContent = '[Audio] ' + msg;
      console.error('[Audio] element error', err || ev);
      showToast('Audio error: ' + msg, 4000);
    };
  }
  bindAudio();

  els.playpause.addEventListener('click', ()=>{
    if (els.audio.paused) els.audio.play().catch(()=>{});
    else els.audio.pause();
  });
  els.seek.addEventListener('input', ()=>{
    if (!isFinite(els.audio.duration)) return;
    els.audio.currentTime = els.audio.duration * parseFloat(els.seek.value || '0');
  });
  els.reload.addEventListener('click', ()=>{
    if (!state.chapter) return;
    setAudioSources(state.chapter);
    els.audio.load();
    els.audio.play().catch(()=>{});
  });
  els.loopHS.addEventListener('change', ()=> state.loopActive = !!els.loopHS.checked);

  /**********************
   * Chapter load/render
   **********************/
  async function loadChapter(path){
    state.chapterPath = path;
    const url = resolveAsset(path);
    const res = await fetch(url, {cache:'no-cache'});
    if (!res.ok) throw new Error(`Failed to load JSON (${res.status}) at ${url}`);
    const json = await res.json();

    // basic normalize
    state.chapter = json;
    state.fps = (json.timecodeFps && +json.timecodeFps) || 30;
    state.naturalW = (json.canvasDimensions && json.canvasDimensions.width) || 6000;
    state.naturalH = (json.canvasDimensions && json.canvasDimensions.height) || 4000;

    // load transcript (persistent captions)
    await loadTranscriptIfAny(json);

    renderChapter(json);
  }

  function setAudioSources(json){
    const a = els.audio;
    a.innerHTML = ''; // clear <source> children
    // Primary WAV
    if (json.audioFile){
      const s1 = document.createElement('source');
      s1.src = resolveAsset(json.audioFile);
      s1.type = 'audio/wav';
      a.appendChild(s1);
    }
    // Optional MP3 fallback if your JSON has "audioFileMp3"
    if (json.audioFileMp3){
      const s2 = document.createElement('source');
      s2.src = resolveAsset(json.audioFileMp3);
      s2.type = 'audio/mpeg';
      a.appendChild(s2);
    }
  }

  function renderChapter(json){
    // Title / id
    els.title.textContent = json.title || 'Untitled Chapter';
    els.chapterId.textContent = json.id ? `ID: ${json.id}` : '';

    // Background
    const bgUrl = resolveAsset(json.backgroundImage);
    els.bg.src = bgUrl;
    els.bg.onload = placeHotspots;
    els.bg.onerror = () => {
      console.error('Background failed:', bgUrl);
      showToast('Background failed to load (404). Check path & repo subfolder.');
    };

    // Audio
    setAudioSources(json);
    els.audio.load();

    // Hotspots
    clearHotspots();
    const list = Array.isArray(json.hotspots) ? json.hotspots : [];
    list.forEach((h,i)=> addHotspot(h,i));
    state.hotspots = list;
    placeHotspots();

    // Reset caption window until audio timeupdate sets it
    state.segStart = 0;
    state.segEnd = 0;
    hideCaption();
  }

  /*****************
   * Boot sequence *
   *****************/
  function getQuery(name){
    return new URLSearchParams(location.search).get(name);
  }

  async function boot(){
    const qChapter = getQuery('chapter');
    const defaultChapter = (qChapter ? `${qChapter}.json` : '2-1.json'); // default fallback
    els.chapterInput.value = defaultChapter;

    try {
      await loadChapter(defaultChapter);
    } catch(err){
      console.error(err);
      showToast('Failed to load chapter JSON. Check file name & path.');
    }
  }

  els.chapterLoad.addEventListener('click', async ()=>{
    const p = (els.chapterInput.value || '').trim();
    if(!p) return;
    try{
      await loadChapter(p);
      showToast('Chapter loaded.');
    }catch(err){
      console.error(err);
      showToast('Failed to load chapter JSON.');
    }
  });

  // Start
  boot();
  </script>
</body>
</html>
