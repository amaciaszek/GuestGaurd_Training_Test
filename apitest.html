<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuestGuard API Diagnostics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      color: #00ff00;
      padding: 20px;
      line-height: 1.6;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: #00ffff;
      margin-bottom: 20px;
      border-bottom: 2px solid #00ffff;
      padding-bottom: 10px;
    }
    
    h2 {
      color: #ffff00;
      margin: 30px 0 15px 0;
      font-size: 18px;
    }
    
    .test-section {
      background: #0a0a0a;
      border: 1px solid #333;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 5px;
    }
    
    .input-group {
      margin-bottom: 15px;
    }
    
    .input-group label {
      display: block;
      color: #888;
      margin-bottom: 5px;
      font-size: 12px;
    }
    
    .input-group input {
      width: 100%;
      background: #000;
      border: 1px solid #333;
      color: #00ff00;
      padding: 8px;
      font-family: 'Courier New', monospace;
    }
    
    button {
      background: #003300;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 10px 20px;
      margin: 5px 5px 5px 0;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
    
    button:hover {
      background: #004400;
    }
    
    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    .success {
      color: #00ff00;
    }
    
    .error {
      color: #ff0000;
    }
    
    .warning {
      color: #ffff00;
    }
    
    .info {
      color: #00ffff;
    }
    
    .result-box {
      background: #000;
      border: 1px solid #333;
      padding: 10px;
      margin: 10px 0;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 11px;
    }
    
    .log-line {
      margin-bottom: 5px;
    }
    
    .timestamp {
      color: #666;
      margin-right: 10px;
    }
    
    pre {
      margin: 10px 0;
      padding: 10px;
      background: #000;
      border-left: 3px solid #00ff00;
      overflow-x: auto;
    }
    
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      margin-left: 10px;
      font-size: 11px;
    }
    
    .status-200 { background: #003300; color: #00ff00; }
    .status-400 { background: #333300; color: #ffff00; }
    .status-401 { background: #330000; color: #ff6666; }
    .status-500 { background: #330000; color: #ff0000; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔬 GuestGuard API Diagnostics Tool</h1>
    
    <div class="test-section">
      <h2>📍 Current Environment</h2>
      <div class="result-box">
        <div>Your Origin: <span class="info" id="currentOrigin"></span></div>
        <div>Your Full URL: <span class="info" id="currentURL"></span></div>
        <div>Protocol: <span class="info" id="currentProtocol"></span></div>
        <div>Target API: <span class="warning">https://guestguard-platform.vercel.app</span></div>
      </div>
    </div>
    
    <div class="test-section">
      <h2>🔑 Token Input</h2>
      <div class="input-group">
        <label>Paste your temp_token here:</label>
        <input type="text" id="tempTokenInput" placeholder="4bb63e6e-3ecd-4989-9c43-c32886d7607c">
      </div>
      <button onclick="runFullDiagnostics()">🚀 Run Full Diagnostics</button>
      <button onclick="testTokenExchange()">🔄 Test Token Exchange Only</button>
    </div>
    
    <div class="test-section">
      <h2>📊 Diagnostic Results</h2>
      <div class="result-box" id="diagnosticLog"></div>
    </div>
    
    <div class="test-section">
      <h2>📦 Last Response Details</h2>
      <div class="result-box" id="responseDetails"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://guestguard-platform.vercel.app';
    const SUPABASE_URL = 'https://wdjxrewqsltxfntccpda.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkanhyZXdxc2x0eGZudGNjcGRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzUzMzc4MjMsImV4cCI6MjA1MDkxMzgyM30.iCuZFMf7rRRwsZGSFx95DxUB9YT0fFGg3gQvVVJKJJw';
    
    // Initialize
    document.getElementById('currentOrigin').textContent = window.location.origin;
    document.getElementById('currentURL').textContent = window.location.href;
    document.getElementById('currentProtocol').textContent = window.location.protocol;
    
    // Auto-detect temp_token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const autoToken = urlParams.get('temp_token');
    if (autoToken) {
      document.getElementById('tempTokenInput').value = autoToken;
      log('✅ Auto-detected temp_token from URL', 'success');
    }
    
    function log(message, type = 'info') {
      const logBox = document.getElementById('diagnosticLog');
      const timestamp = new Date().toLocaleTimeString();
      const colorClass = type;
      logBox.innerHTML += `<div class="log-line"><span class="timestamp">[${timestamp}]</span><span class="${colorClass}">${message}</span></div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }
    
    function showResponse(title, data) {
      const box = document.getElementById('responseDetails');
      box.innerHTML = `<div class="info">${title}</div><pre>${JSON.stringify(data, null, 2)}</pre>`;
    }
    
    async function runFullDiagnostics() {
      const tempToken = document.getElementById('tempTokenInput').value.trim();
      
      if (!tempToken) {
        log('❌ Please enter a temp_token first!', 'error');
        return;
      }
      
      document.getElementById('diagnosticLog').innerHTML = '';
      log('🚀 Starting full diagnostic sequence...', 'info');
      log('═════════════════════════════════════════', 'info');
      
      // Test 1: Basic connectivity
      log('', 'info');
      log('TEST 1: Basic API Connectivity', 'warning');
      log('─────────────────────────────────────────', 'info');
      await testBasicConnectivity();
      
      // Test 2: CORS preflight
      log('', 'info');
      log('TEST 2: CORS Preflight Check', 'warning');
      log('─────────────────────────────────────────', 'info');
      await testCORSPreflight();
      
      // Test 3: Token exchange
      log('', 'info');
      log('TEST 3: Token Exchange Endpoint', 'warning');
      log('─────────────────────────────────────────', 'info');
      await testTokenExchangeDetailed(tempToken);
      
      log('', 'info');
      log('═════════════════════════════════════════', 'info');
      log('✅ Diagnostics complete!', 'success');
    }
    
    async function testBasicConnectivity() {
      try {
        log('📡 Testing basic connectivity to API...', 'info');
        log(`Target: ${API_BASE}`, 'info');
        
        const response = await fetch(API_BASE, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });
        
        log(`✅ Connection successful! Status: ${response.status}`, 'success');
        log(`Response headers available: ${response.headers ? 'Yes' : 'No'}`, 'info');
        
        const corsHeader = response.headers.get('Access-Control-Allow-Origin');
        if (corsHeader) {
          log(`✅ CORS header present: ${corsHeader}`, 'success');
        } else {
          log(`⚠️ No CORS header found in response`, 'warning');
        }
        
        return true;
      } catch (error) {
        log(`❌ Connection failed: ${error.message}`, 'error');
        log(`This indicates a network or CORS issue`, 'error');
        return false;
      }
    }
    
    async function testCORSPreflight() {
      try {
        log('🔍 Testing CORS with OPTIONS request...', 'info');
        
        const response = await fetch(`${API_BASE}/api/training-auth`, {
          method: 'OPTIONS',
          headers: {
            'Origin': window.location.origin,
            'Access-Control-Request-Method': 'GET',
            'Access-Control-Request-Headers': 'content-type'
          }
        });
        
        log(`Status: ${response.status}`, 'info');
        
        const allowOrigin = response.headers.get('Access-Control-Allow-Origin');
        const allowMethods = response.headers.get('Access-Control-Allow-Methods');
        const allowHeaders = response.headers.get('Access-Control-Allow-Headers');
        
        log(`Allow-Origin: ${allowOrigin || 'NOT SET'}`, allowOrigin ? 'success' : 'error');
        log(`Allow-Methods: ${allowMethods || 'NOT SET'}`, allowMethods ? 'success' : 'error');
        log(`Allow-Headers: ${allowHeaders || 'NOT SET'}`, allowHeaders ? 'success' : 'warning');
        
        if (!allowOrigin) {
          log('❌ CORS is NOT configured properly!', 'error');
          log(`Your origin (${window.location.origin}) needs to be added to CORS whitelist`, 'error');
        }
        
        return !!allowOrigin;
      } catch (error) {
        log(`❌ CORS preflight failed: ${error.message}`, 'error');
        return false;
      }
    }
    
    async function testTokenExchangeDetailed(tempToken) {
      try {
        log('🔑 Attempting token exchange...', 'info');
        const url = `${API_BASE}/api/training-auth?temp_token=${tempToken}`;
        log(`URL: ${url}`, 'info');
        
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          }
        });
        
        log(`Response Status: ${response.status} ${response.statusText}`, 
            response.ok ? 'success' : 'error');
        
        // Try to get response body regardless of status
        let data;
        const contentType = response.headers.get('content-type');
        log(`Content-Type: ${contentType}`, 'info');
        
        if (contentType && contentType.includes('application/json')) {
          data = await response.json();
          log('✅ Response is valid JSON', 'success');
        } else {
          const text = await response.text();
          log(`⚠️ Response is not JSON. Body: ${text.substring(0, 200)}`, 'warning');
          data = { raw_response: text };
        }
        
        showResponse('Token Exchange Response', data);
        
        if (response.ok) {
          log('✅ Token exchange successful!', 'success');
          if (data.access_token) {
            log(`✅ Access token received: ${data.access_token.substring(0, 20)}...`, 'success');
          }
          if (data.user) {
            log(`✅ User: ${data.user.email}`, 'success');
          }
        } else {
          log(`❌ Token exchange failed with status ${response.status}`, 'error');
          if (data.error) {
            log(`Error message: ${data.error}`, 'error');
          }
          if (data.message) {
            log(`Message: ${data.message}`, 'error');
          }
        }
        
        return response.ok;
      } catch (error) {
        log(`❌ Token exchange error: ${error.name}: ${error.message}`, 'error');
        
        // Detailed error analysis
        if (error.message === 'Failed to fetch') {
          log('', 'error');
          log('🔍 "Failed to fetch" usually means:', 'warning');
          log('  1. CORS headers are missing or incorrect', 'warning');
          log('  2. The endpoint does not exist', 'warning');
          log('  3. Network/firewall blocking the request', 'warning');
          log('  4. The API server is down', 'warning');
        }
        
        showResponse('Error Details', {
          error: error.message,
          name: error.name,
          stack: error.stack
        });
        
        return false;
      }
    }
    
    async function testTokenExchange() {
      const tempToken = document.getElementById('tempTokenInput').value.trim();
      
      if (!tempToken) {
        log('❌ Please enter a temp_token first!', 'error');
        return;
      }
      
      document.getElementById('diagnosticLog').innerHTML = '';
      await testTokenExchangeDetailed(tempToken);
    }
    
    // Additional helper: Test direct Supabase connection
    async function testSupabaseDirectly() {
      log('', 'info');
      log('🔷 Testing direct Supabase connection...', 'info');
      
      try {
        const response = await fetch(`${SUPABASE_URL}/auth/v1/health`, {
          headers: {
            'apikey': SUPABASE_KEY
          }
        });
        
        log(`Supabase Health Check: ${response.status}`, response.ok ? 'success' : 'error');
        
        if (response.ok) {
          const data = await response.json();
          showResponse('Supabase Health', data);
        }
      } catch (error) {
        log(`❌ Supabase connection failed: ${error.message}`, 'error');
      }
    }
  </script>
</body>
</html>
